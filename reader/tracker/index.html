<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>Reading Tracker</title>
<link rel="preload" href="/A-father-of-the-fatherless/reader/assets/opendyslexic-latin-400-normal-nUhe5EwG.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/A-father-of-the-fatherless/reader/assets/opendyslexic-latin-700-normal-Bnmt45Ln.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/A-father-of-the-fatherless/reader/tracker/tracker.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="row">
      <h1 class="grow">Reading Tracker</h1>
      <a class="btnlink" href="/A-father-of-the-fatherless/reader/">Back to reader</a>
    </div>
    <div class="prog">
      <span id="progText">Read 0 of 31,102 verses</span>
      <span id="progPct">0%</span>
    </div>
    <div class="bar" aria-hidden="true"><i id="progBar"></i></div>
  </div>
</header>
<main class="wrap">
  <h2>Bible map</h2>
  <p class="small muted">One dot for each verse. White is not read. Green is read. Tap a dot to see which verse it is. Progress is saved on this device. Sign in to keep it on every device you use.</p>
  <div id="map"></div>
</main>
<script src="/A-father-of-the-fatherless/reader/assets/reading-progress.js"></script>
</body>
</html>
