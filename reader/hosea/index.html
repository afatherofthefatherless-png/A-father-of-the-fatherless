<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Redirecting to Biblia Dyslexia</title>
<script>
(function () {
  var ROOT = "/A-father-of-the-fatherless";
  var prefix = ROOT + "/reader";
  var path = location.pathname;
  var hash = location.hash || "";
  var m = hash.match(/^#\/([A-Za-z0-9][A-Za-z0-9-]*)(?:\/(\d+)(?:\/(\d+))?)?\/?$/);
  if (m && ["home","record","stitch","xref"].indexOf(m[1].toLowerCase()) === -1) {
    var d = ROOT + "/" + m[1].toLowerCase() + "/";
    if (m[2]) d += m[2] + "/";
    if (m[3]) d += "#" + m[3];
    location.replace(d + location.search);
    return;
  }
  var rest = "/";
  if (path === prefix || path === prefix + "/") rest = "/";
  else if (path.indexOf(prefix + "/") === 0) {
    rest = path.slice(prefix.length);
    if (rest.charAt(rest.length - 1) !== "/") rest += "/";
  }
  location.replace(ROOT + rest + location.search + hash);
})();
</script>
</head>
<body style="background:#000;color:#fff;font-family:sans-serif;padding:24px">
<p>This Bible reader now lives on the homepage.</p>
<p><a href="/A-father-of-the-fatherless/" style="color:#fff">Open Biblia Dyslexia</a></p>
</body>
</html>
