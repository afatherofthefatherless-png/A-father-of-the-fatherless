<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page not found</title>
<script>
(function () {
  var ROOT = "/A-father-of-the-fatherless";
  var hash = location.hash || "";
  var m = hash.match(/^#\/([A-Za-z0-9][A-Za-z0-9-]*)(?:\/(\d+)(?:\/(\d+))?)?\/?$/);
  if (/^#\/xref(?:\?.*)?$/i.test(hash)) {
    location.replace(ROOT + "/cross-refs/" + location.search);
    return;
  }
  if (/^#\/(?:home|record|stitch)(?:\?.*)?$/i.test(hash)) {
    location.replace("https://afatherofthefatherless-png.github.io/kjv-recorder/recorder/" + location.search);
    return;
  }
  if (m && ["home","record","stitch","xref"].indexOf(m[1].toLowerCase()) === -1) {
    var d = ROOT + "/" + m[1].toLowerCase() + "/";
    if (m[2]) d += m[2] + "/";
    if (m[3]) d += "#" + m[3];
    location.replace(d + location.search);
    return;
  }
})();
</script>
</head>
