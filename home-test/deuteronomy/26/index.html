<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Redirecting…</title>
<script>
(function () {
  var ROOT = "/A-father-of-the-fatherless";
  var prefix = ROOT + "/home-test";
  var path = location.pathname;
  var rest = "/";
  if (path === prefix || path === prefix + "/" || path === prefix + "/index.html") {
    rest = "/";
  } else if (path.indexOf(prefix + "/") === 0) {
    rest = path.slice(prefix.length);
    rest = rest.replace(/\/index\.html$/, "/");
    if (rest === "/index.html" || rest === "") rest = "/";
    if (rest.charAt(rest.length - 1) !== "/") rest += "/";
  }
  location.replace(ROOT + rest + location.search + location.hash);
})();
</script>
</head>
<body style="background:#000;color:#fff;font-family:sans-serif;padding:24px">
<p>This test page has moved.</p>
<p><a href="/A-father-of-the-fatherless/" style="color:#fff">Open Biblia Dyslexia</a></p>
</body>
</html>
