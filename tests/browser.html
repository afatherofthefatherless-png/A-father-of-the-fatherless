<!doctype html>
<meta charset="utf-8">
<title>KJV site tests (browser)</title>
<pre id="out"></pre>
<script type="module">
  const out = document.getElementById('out'); const log = s => { out.textContent += s + '\n'; };
  const { runAll } = await import('./all.js');
  await import('./browser.test.js');
  const r = await runAll(log);
  window.__result = r;
  try { await fetch('/__result', { method: 'POST', body: JSON.stringify({ ...r, log: out.textContent }) }); } catch {}
</script>
